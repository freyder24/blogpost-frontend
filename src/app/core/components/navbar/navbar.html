<nav class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between py-3">
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
          />
        </svg>
      </div>

      <span class="text-xl font-bold text-teal-700"> Travel América Latina </span>
    </div>

    <!-- Barra de busqueda -->
    <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
      <div class="relative w-full">
        <svg
          lucideSearch
          class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
        ></svg>

        <input
          type="text"
          placeholder="Explorar destinos..."
          class="w-full pl-10 pr-4 py-2.5 bg-gray-100 rounded-full text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>
    </div>

    <!-- Menu desktop -->
    <div class="hidden md:flex items-center gap-6">
      <!-- Dropdown Administrador -->
      <div class="relative" data-dropdown>
        <button
          type="button"
          (click)="toggleDropdown()"
          class="flex items-center gap-1 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:text-teal-700 transition-colors rounded-full hover:bg-gray-100"
        >
          Administración
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4 transition-transform"
            [class.rotate-180]="isDropdownOpen()"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (isDropdownOpen()) {
          <div
            class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50 animate-fade-in"
          >
            <a
              routerLink="/admin/categories"
              class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"
                />
              </svg>
              Lista Categorías
            </a>

            <a
              routerLink="/admin/blog-posts"
              class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                />
              </svg>
              Lista Blog Posts
            </a>
          </div>
        }
      </div>

      <!-- Iniciar sesion -->
      <button
        type="button"
        class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold px-5 py-2.5 rounded-full text-sm transition-colors"
      >
        Iniciar sesión
      </button>
    </div>

    <!-- Boton hamburguesa -->
    <button
      (click)="toggleMenu()"
      class="md:hidden p-2 text-gray-600 hover:text-gray-900 focus:outline-none"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      @if (isMenuOpen()) {
        <svg lucideX class="w-6 h-6"></svg>
      } @else {
        <svg lucideMenu class="w-6 h-6"></svg>
      }
    </button>
  </div>
</nav>

<!-- Menu movil -->
@if (isMenuOpen()) {
  <div class="md:hidden bg-white border-t border-gray-200 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 space-y-4">
      <!-- Barra de busqueda -->
      <div class="relative">
        <svg
          lucideSearch
          class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
        ></svg>

        <input
          type="text"
          placeholder="Explorar destinos..."
          class="w-full pl-10 pr-4 py-2.5 bg-gray-100 rounded-full text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>

      <!-- Dropdown Administrador -->
      <div>
        <button
          type="button"
          (click)="toggleMobileDropdown('admin')"
          class="w-full flex items-center justify-between py-3 text-sm font-semibold text-gray-700 hover:text-teal-700 transition-colors"
        >
          <span class="flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 01-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Administrador
          </span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4 transition-transform"
            [class.rotate-180]="mobileDropdownOpen() === 'admin'"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (mobileDropdownOpen()) {
          <div class="pl-6 space-y-1 mt-1">
            <a
              routerLink="/admin/categories"
              class="block py-2 text-sm text-gray-600 hover:text-teal-700"
            >
              Lista Categorías
            </a>

            <a
              routerLink="/admin/blog-posts"
              class="block py-2 text-sm text-gray-600 hover:text-teal-700"
            >
              Lista Blog Posts
            </a>
          </div>
        }
      </div>

      <!-- Iniciar sesion -->
      <button
        type="button"
        class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold px-5 py-2.5 rounded-full text-sm transition-colors"
      >
        Iniciar sesión
      </button>
    </div>
  </div>
}
